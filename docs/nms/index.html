<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMS Form | KETL</title>
<meta name="description" content="Fill in the NMS form on the KETL site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .nms-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 28px 96px;
  }
  .nms-wrap h1 {
    font-family: var(--font-heading);
    font-size: 30px;
    margin: 0 0 12px;
    color: var(--color-text);
  }
  .nms-wrap p {
    color: var(--color-neutral-800);
  }
  .nms-form {
    display: none;
    margin-top: 28px;
    border: 1px solid var(--color-divider);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .nms-form.is-open {
    display: block;
  }
  .nms-form iframe {
    display: block;
    width: 100%;
    height: 1400px;
    border: 0;
  }
  .nms-fallback {
    margin-top: 12px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div style="background:var(--color-bg);">

  <header style="position:sticky;top:0;z-index:60;background:rgba(245,234,216,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--color-divider);">
    <div style="max-width:1180px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;">
      <a href="/" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--color-text);">
        <img src="../uploads/KETL-Circular-3d-logo-ketl-kanga-kk.png" alt="KETL" style="width:46px;height:46px;border-radius:999px;object-fit:cover;">
        <span style="display:flex;flex-direction:column;line-height:1.05;">
          <span style="font-family:var(--font-heading);font-size:1.22rem;letter-spacing:0.01em;">KETL</span>
          <span style="font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600;">Kanga EdTech Vision Labs</span>
        </span>
      </a>
      <nav style="display:flex;align-items:center;gap:20px;margin-left:auto;flex-wrap:wrap;font-size:0.86rem;font-weight:500;">
        <a href="/#about" style="text-decoration:none;color:var(--color-neutral-800);">About</a>
        <a href="/#services" style="text-decoration:none;color:var(--color-neutral-800);">Services</a>
        <a href="/#pricing" style="text-decoration:none;color:var(--color-neutral-800);">Pricing</a>
        <a href="/aia" style="text-decoration:none;color:var(--color-neutral-800);">AI for Adolescents</a>
        <a href="/tc" style="text-decoration:none;color:var(--color-neutral-800);">Terms</a>
        <a class="btn btn-primary" href="https://wa.me/61470110227?text=Hi%20KETL%2C%20I%20have%20a%20question%20about%20the%20programs." style="text-decoration:none;">Talk on WhatsApp</a>
      </nav>
    </div>
  </header>

  <div class="nms-wrap">
    <h1>NMS Form</h1>
    <p>Open the form below to fill it in right here on the KETL site.</p>

    <a class="btn btn-primary" id="nms-open" href="https://forms.gle/bjbsFMuzzSBRQTM98" style="text-decoration:none;">Open the form</a>

    <div class="nms-form" id="nms-form">
      <iframe id="nms-frame" title="NMS Google Form" loading="lazy">Loading…</iframe>
    </div>

    <p class="nms-fallback">Form not showing? <a href="https://forms.gle/bjbsFMuzzSBRQTM98" target="_blank" rel="noopener" style="color:var(--color-accent);font-weight:600;">Open it in a new tab</a>.</p>
  </div>

</div>

<script>
  document.getElementById('nms-open').addEventListener('click', function (e) {
    e.preventDefault();
    var frame = document.getElementById('nms-frame');
    if (!frame.src) frame.src = this.href;
    var box = document.getElementById('nms-form');
    box.classList.add('is-open');
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
</script>

</body>
</html>
